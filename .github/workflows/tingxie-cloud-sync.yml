name: Ting Xie cloud sync and speed

on:
  pull_request:
    paths:
      - 'tingxie/app-cloud-sync.js'
      - 'tingxie/app-rate-scale-fix.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/cloud-sync.mjs'
      - 'tingxie/tests/rate-scale.mjs'
      - '.github/workflows/tingxie-cloud-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'tingxie/app-cloud-sync.js'
      - 'tingxie/app-rate-scale-fix.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/cloud-sync.mjs'
      - 'tingxie/tests/rate-scale.mjs'
      - '.github/workflows/tingxie-cloud-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cloud-sync-and-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Check JavaScript syntax
        run: |
          node --check tingxie/app-cloud-sync.js
          node --check tingxie/app-rate-scale-fix.js
          node --check tingxie/boot.js
          node --check tingxie/tests/cloud-sync.mjs
          node --check tingxie/tests/rate-scale.mjs

      - name: Test cross-device profiles and lists
        run: node tingxie/tests/cloud-sync.mjs

      - name: Test slower speech scale and top link
        run: node tingxie/tests/rate-scale.mjs

      - name: Upload local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-cloud-sync-speed-evidence
          path: |
            /tmp/tingxie-cloud-sync-pass.png
            /tmp/tingxie-cloud-sync-device-a-failure.png
            /tmp/tingxie-cloud-sync-device-b-failure.png
            /tmp/tingxie-cloud-sync-error.txt
            /tmp/tingxie-rate-scale-pass.png
            /tmp/tingxie-rate-scale-failure.png
            /tmp/tingxie-rate-scale-error.txt
          if-no-files-found: ignore

  verify-live-cloud-sync-and-speed:
    if: github.event_name == 'push'
    needs: cloud-sync-and-speed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark public verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tingxie-live-cloud-sync-speed',
              description: 'Testing deployed cross-device sync, speed and top link',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install live-test browser
        run: |
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Test public cross-device sync
        id: cloud_test
        continue-on-error: true
        env:
          TINGXIE_BASE_URL: https://edyeo82.github.io/chineseflashcard/tingxie/
        run: node tingxie/tests/cloud-sync.mjs

      - name: Test public speech scale and top link
        id: rate_test
        continue-on-error: true
        env:
          TINGXIE_BASE_URL: https://edyeo82.github.io/chineseflashcard/tingxie/
        run: node tingxie/tests/rate-scale.mjs

      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-live-cloud-sync-speed-evidence
          path: |
            /tmp/tingxie-cloud-sync-pass.png
            /tmp/tingxie-cloud-sync-device-a-failure.png
            /tmp/tingxie-cloud-sync-device-b-failure.png
            /tmp/tingxie-cloud-sync-error.txt
            /tmp/tingxie-rate-scale-pass.png
            /tmp/tingxie-rate-scale-failure.png
            /tmp/tingxie-rate-scale-error.txt
          if-no-files-found: ignore

      - name: Publish public result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.cloud_test.outcome }}' === 'success' && '${{ steps.rate_test.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tingxie-live-cloud-sync-speed',
              description: passed ? 'Deployed sync, speed and top link passed' : 'Deployed sync, speed or top link failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail when public verification failed
        if: steps.cloud_test.outcome != 'success' || steps.rate_test.outcome != 'success'
        run: exit 1
