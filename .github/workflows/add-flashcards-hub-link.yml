name: Add flashcards hub link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-flashcards-hub-link.yml'

permissions:
  contents: write

jobs:
  update-flashcards-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add quiet Learning apps link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('flashcards/index.html')
          text = page.read_text(encoding='utf-8')

          old_css = 'header{text-align:center;padding:10px 12px 4px}h1{margin:0;font-size:clamp(22px,5vw,42px)}'
          new_css = ('header{text-align:center;padding:10px 12px 4px}'
                     '.hubLink{display:inline-flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}'
                     '.hubLink:hover,.hubLink:focus-visible{color:var(--accent);text-decoration:underline;outline:none}'
                     'h1{margin:0;font-size:clamp(22px,5vw,42px)}')

          old_header = '<header><h1>Higher Chinese Flashcards</h1></header>'
          new_header = '<header><a class="hubLink" href="../" aria-label="Back to learning apps">← Learning apps</a><h1>Higher Chinese Flashcards</h1></header>'

          if 'class="hubLink"' not in text:
              if old_css not in text:
                  raise SystemExit('Expected header CSS was not found; no file was changed.')
              if old_header not in text:
                  raise SystemExit('Expected flashcard header was not found; no file was changed.')
              text = text.replace(old_css, new_css, 1)
              text = text.replace(old_header, new_header, 1)
              page.write_text(text, encoding='utf-8')

          updated = page.read_text(encoding='utf-8')
          assert 'href="../"' in updated
          assert '← Learning apps' in updated
          assert 'class="hubLink"' in updated

          workflow = Path('.github/workflows/add-flashcards-hub-link.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit the header link
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flashcards/index.html .github/workflows/add-flashcards-hub-link.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Add Learning apps link to flashcards"
          git push origin HEAD:main
