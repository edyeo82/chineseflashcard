name: Ting Xie word checklist

on:
  pull_request:
    paths:
      - 'tingxie/app-word-checklist-voice.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/word-checklist-voice.mjs'
      - '.github/workflows/tingxie-word-checklist.yml'
  push:
    branches:
      - main
    paths:
      - 'tingxie/app-word-checklist-voice.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/word-checklist-voice.mjs'
      - '.github/workflows/tingxie-word-checklist.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  word-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Check JavaScript syntax
        run: |
          node --check tingxie/app-word-checklist-voice.js
          node --check tingxie/boot.js
          node --check tingxie/tests/word-checklist-voice.mjs

      - name: Test checklist, voice and apps button
        run: node tingxie/tests/word-checklist-voice.mjs

      - name: Upload checklist evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-word-checklist-evidence
          path: |
            /tmp/tingxie-word-checklist-pass.png
            /tmp/tingxie-word-checklist-failure.png
            /tmp/tingxie-word-checklist-error.txt
          if-no-files-found: ignore

  verify-live-word-checklist:
    if: github.event_name == 'push'
    needs: word-checklist
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark public checklist verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tingxie-live-word-checklist',
              description: 'Testing deployed checklist and Mandarin voice controls',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install live-test browser
        run: |
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Test public checklist and voice controls
        id: live_test
        continue-on-error: true
        env:
          TINGXIE_BASE_URL: https://edyeo82.github.io/chineseflashcard/tingxie/
        run: node tingxie/tests/word-checklist-voice.mjs

      - name: Upload public checklist evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-live-word-checklist-evidence
          path: |
            /tmp/tingxie-word-checklist-pass.png
            /tmp/tingxie-word-checklist-failure.png
            /tmp/tingxie-word-checklist-error.txt
          if-no-files-found: ignore

      - name: Publish public checklist result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.live_test.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tingxie-live-word-checklist',
              description: passed ? 'Deployed checklist and voice controls passed' : 'Deployed checklist and voice controls failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail when public checklist verification failed
        if: steps.live_test.outcome != 'success'
        run: exit 1
