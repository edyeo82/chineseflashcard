name: Ting Xie standard Mandarin voice

on:
  pull_request:
    paths:
      - 'tingxie/app-standard-mandarin-voice.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/standard-mandarin-voice.mjs'
      - '.github/workflows/tingxie-standard-voice.yml'
  push:
    branches:
      - main
    paths:
      - 'tingxie/app-standard-mandarin-voice.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/standard-mandarin-voice.mjs'
      - '.github/workflows/tingxie-standard-voice.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  standard-mandarin-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Check JavaScript syntax
        run: |
          node --check tingxie/app-standard-mandarin-voice.js
          node --check tingxie/boot.js
          node --check tingxie/tests/standard-mandarin-voice.mjs

      - name: Test standard female Mandarin selection
        run: node tingxie/tests/standard-mandarin-voice.mjs

      - name: Upload voice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-standard-voice-evidence
          path: |
            /tmp/tingxie-standard-voice-pass.png
            /tmp/tingxie-standard-voice-failure.png
            /tmp/tingxie-standard-voice-error.txt
          if-no-files-found: ignore

  verify-live-standard-mandarin-voice:
    if: github.event_name == 'push'
    needs: standard-mandarin-voice
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark public voice verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tingxie-live-standard-voice',
              description: 'Testing deployed standard female Mandarin voice',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install live-test browser
        run: |
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Test public standard female Mandarin voice
        id: live_test
        continue-on-error: true
        env:
          TINGXIE_BASE_URL: https://edyeo82.github.io/chineseflashcard/tingxie/
        run: node tingxie/tests/standard-mandarin-voice.mjs

      - name: Upload public voice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-live-standard-voice-evidence
          path: |
            /tmp/tingxie-standard-voice-pass.png
            /tmp/tingxie-standard-voice-failure.png
            /tmp/tingxie-standard-voice-error.txt
          if-no-files-found: ignore

      - name: Publish public voice result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.live_test.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tingxie-live-standard-voice',
              description: passed ? 'Deployed standard female Mandarin voice passed' : 'Deployed standard female Mandarin voice failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail when public voice verification failed
        if: steps.live_test.outcome != 'success'
        run: exit 1
