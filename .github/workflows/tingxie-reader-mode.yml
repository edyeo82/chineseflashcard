name: Ting Xie reader mode

on:
  pull_request:
    paths:
      - 'tingxie/app-reader-mode.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/reader-mode.mjs'
      - '.github/workflows/tingxie-reader-mode.yml'
  push:
    branches:
      - main
    paths:
      - 'tingxie/app-reader-mode.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/reader-mode.mjs'
      - '.github/workflows/tingxie-reader-mode.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  reader-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Check JavaScript syntax
        run: |
          node --check tingxie/app-reader-mode.js
          node --check tingxie/tests/reader-mode.mjs

      - name: Test slower reading and list controls
        run: node tingxie/tests/reader-mode.mjs

      - name: Upload reader-mode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-reader-mode-evidence
          path: |
            /tmp/tingxie-reader-mode-pass.png
            /tmp/tingxie-reader-mode-failure.png
            /tmp/tingxie-reader-mode-error.txt
          if-no-files-found: ignore

  verify-live-reader-mode:
    if: github.event_name == 'push'
    needs: reader-mode
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark public reader verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tingxie-live-reader-mode',
              description: 'Testing deployed slower reader controls',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install live-test browser
        run: |
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Test public reader mode
        id: live_test
        continue-on-error: true
        env:
          TINGXIE_BASE_URL: https://edyeo82.github.io/chineseflashcard/tingxie/
        run: node tingxie/tests/reader-mode.mjs

      - name: Upload public reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-live-reader-mode-evidence
          path: |
            /tmp/tingxie-reader-mode-pass.png
            /tmp/tingxie-reader-mode-failure.png
            /tmp/tingxie-reader-mode-error.txt
          if-no-files-found: ignore

      - name: Publish public reader result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.live_test.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tingxie-live-reader-mode',
              description: passed ? 'Deployed reader mode passed' : 'Deployed reader mode failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail when public reader verification failed
        if: steps.live_test.outcome != 'success'
        run: exit 1
