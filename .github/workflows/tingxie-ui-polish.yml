name: Ting Xie UI polish

on:
  pull_request:
    paths:
      - 'tingxie/app-ui-polish.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/ui-polish.mjs'
      - '.github/workflows/tingxie-ui-polish.yml'
  push:
    branches:
      - main
    paths:
      - 'tingxie/app-ui-polish.js'
      - 'tingxie/boot.js'
      - 'tingxie/index.html'
      - 'tingxie/tests/ui-polish.mjs'
      - '.github/workflows/tingxie-ui-polish.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  ui-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Check JavaScript syntax
        run: |
          node --check tingxie/app-ui-polish.js
          node --check tingxie/boot.js
          node --check tingxie/tests/ui-polish.mjs

      - name: Test desktop and mobile UI
        run: node tingxie/tests/ui-polish.mjs

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-ui-polish-evidence
          path: |
            /tmp/tingxie-ui-polish-desktop-pass.png
            /tmp/tingxie-ui-polish-mobile-pass.png
            /tmp/tingxie-ui-polish-error.txt
          if-no-files-found: ignore

  verify-live-ui-polish:
    if: github.event_name == 'push'
    needs: ui-polish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark public UI verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tingxie-live-ui-polish',
              description: 'Testing deployed Ting Xie desktop/mobile UI',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install live-test browser
        run: |
          npm install --no-save --silent playwright@1.54.1
          npx playwright install --with-deps chromium >/dev/null

      - name: Test public UI polish
        id: live_test
        continue-on-error: true
        env:
          TINGXIE_BASE_URL: https://edyeo82.github.io/chineseflashcard/tingxie/
        run: node tingxie/tests/ui-polish.mjs

      - name: Upload public UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tingxie-live-ui-polish-evidence
          path: |
            /tmp/tingxie-ui-polish-desktop-pass.png
            /tmp/tingxie-ui-polish-mobile-pass.png
            /tmp/tingxie-ui-polish-error.txt
          if-no-files-found: ignore

      - name: Publish public UI result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.live_test.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'tingxie-live-ui-polish',
              description: passed ? 'Deployed Ting Xie UI polish passed' : 'Deployed Ting Xie UI polish failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail when public UI verification failed
        if: steps.live_test.outcome != 'success'
        run: exit 1
