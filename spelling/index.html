<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef8ff">
<title>Spelling Coach · KidoTree</title>
<style>
:root{--bg:#eef8ff;--ink:#183042;--muted:#667985;--line:#d6e6ef;--blue:#2476d2;--orange:#e98636;--shadow:0 16px 45px rgba(38,83,110,.13)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#d9ecff,transparent 26rem),radial-gradient(circle at 100% 8%,#ffe5cf,transparent 25rem),var(--bg)}button,input,textarea,select{font:inherit}.header,.shell{width:min(980px,calc(100% - 28px));margin:auto}.header{padding:max(24px,env(safe-area-inset-top)) 0 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{margin:0;color:var(--blue);font-size:.72rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.header h1{margin:4px 0;font-size:clamp(2rem,7vw,3.5rem);line-height:1}.subtitle,.help{color:var(--muted)}.subtitle{margin:0}.shell{padding-bottom:48px}.stepper{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 18px}.step{border:1px solid var(--line);border-radius:16px;padding:11px;background:#ffffffc8;color:var(--muted);font-weight:850}.step span{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:5px;border-radius:50%;background:#e4edf2}.step.active{background:var(--blue);color:#fff}.step.active span{background:#fff;color:var(--blue)}.panel{display:none}.panel.active{display:block}.heading{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:8px 2px 14px}.heading h2{margin:2px 0;font-size:clamp(1.5rem,4vw,2.2rem)}.kicker{margin:0;color:var(--blue);font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px}.card,.practice-card{background:#fffffff5;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}label{display:block;font-weight:850;margin-bottom:7px}.input,.select,.list{width:100%;border:1px solid #cbdde7;border-radius:14px;background:#fbfdff;color:var(--ink);padding:13px}.list{min-height:210px;resize:vertical;line-height:1.65}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-flex;border-radius:999px;background:#e7f2ff;color:#155cae;padding:6px 10px;font-size:.76rem;font-weight:900}.help{font-size:.86rem;line-height:1.5}.settings{margin:14px 0}.settings summary{cursor:pointer;font-weight:850}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.45}.primary{background:var(--blue);color:#fff}.accent{background:var(--orange);color:#fff}.secondary{background:#e9f1f5;color:var(--ink)}.text-btn{border:0;background:none;color:var(--blue);font-weight:900;cursor:pointer;text-decoration:none}.full{width:100%;margin-top:12px}.word-checklist{display:grid;gap:8px;margin-top:14px;max-height:330px;overflow:auto}.word-item{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:10px 12px;background:#fbfdff}.word-item input{width:21px;height:21px;margin:0}.word-item span{font-weight:760}.check-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.small{padding:9px 12px;font-size:.85rem}.practice-card{max-width:760px;margin:auto;text-align:center}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800}.progress{height:10px;background:#e5eef3;border-radius:99px;overflow:hidden;margin:13px 0 24px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#58a9f5)}.hidden-word{padding:30px 16px}.hidden-word .icon{font-size:4rem}.hidden-word h3{font-size:clamp(2rem,7vw,3.5rem);margin:10px 0}.controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px}.extra-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#173042;color:#fff;padding:11px 16px;border-radius:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:720px){.grid{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls .speak{grid-column:1/-1;grid-row:1}.extra-controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><div><p class="eyebrow">KidoTree Learning</p><h1>Spelling Coach</h1><p class="subtitle">Prepare → Listen → Repeat</p></div><a class="text-btn" href="../">Home</a></header>
<main class="shell">
<nav class="stepper"><button class="step active" data-step="setup"><span>1</span>Prepare</button><button class="step" data-step="dictation"><span>2</span>Listen</button></nav>
<section id="setup" class="panel active"><div class="heading"><div><p class="kicker">Step 1</p><h2>Prepare the spelling list</h2></div><button id="loadLast" class="text-btn">Load last list</button></div><div class="grid"><div class="card"><label for="profile">Child / profile</label><input id="profile" class="input" maxlength="30" placeholder="e.g. Kate"><label for="lesson" style="margin-top:14px">List name</label><input id="lesson" class="input" maxlength="50" placeholder="e.g. Week 6 Spelling"><details class="settings" open><summary>Voice and practice settings</summary><div class="settings-grid"><label>English voice<select id="voice" class="select"><option value="us-female">US Female</option><option value="us-male">US Male</option><option value="uk-female">UK Female</option><option value="uk-male">UK Male</option></select></label><label>Speaking speed<select id="rate" class="select"><option value="0.78">Slow</option><option value="0.92" selected>Normal</option><option value="1.05">Fast</option></select></label><label>Repeat each word<select id="repeat" class="select"><option value="1" selected>Once</option><option value="2">Twice</option><option value="3">Three times</option></select></label><label>Pause between repeats<select id="pause" class="select"><option value="450">Short</option><option value="800" selected>Normal</option><option value="1250">Long</option></select></label></div></details><button id="testVoice" class="btn primary full">🔊 Test selected voice</button><p id="voiceNote" class="help">The exact system voice depends on the device.</p></div><div class="card"><div class="row"><label for="words">Words or phrases</label><span id="count" class="pill">0 selected</span></div><textarea id="words" class="list" placeholder="One word or phrase per line, for example:&#10;beautiful&#10;environment&#10;in spite of"></textarea><div class="check-actions"><button id="allOn" class="btn secondary small">Enable all</button><button id="allOff" class="btn secondary small">Disable all</button></div><div id="checklist" class="word-checklist"></div><button id="start" class="btn accent full" disabled>Start spelling</button></div></div></section>
<section id="dictation" class="panel"><div class="heading"><div><p class="kicker">Step 2</p><h2>Listen and write</h2></div><button id="back" class="text-btn">Back to list</button></div><div class="practice-card"><div class="meta"><span id="session" class="pill">Original order</span><span id="progressText">1 of 1</span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="hidden-word"><div class="icon">🔊</div><h3 id="number">Word 1</h3><p>The word is hidden. Listen and write it on paper.</p></div><div class="controls"><button id="prev" class="btn secondary">← Previous</button><button id="speak" class="btn primary speak">🔊 Say again</button><button id="next" class="btn accent">Next →</button></div><div class="extra-controls"><button id="shuffle" class="btn secondary">🔀 Shuffle</button><button id="restart" class="btn secondary">↺ Back to start</button></div></div></section>
</main><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='kidotree-spelling-v3';let words=[],enabled=[],session=[],at=0,shuffled=false;const store=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return{}}},save=()=>localStorage.setItem(key,JSON.stringify({profile:$('profile').value,lesson:$('lesson').value,words:$('words').value,enabled,voice:$('voice').value,rate:$('rate').value,repeat:$('repeat').value,pause:$('pause').value})),toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)},parse=()=>$('words').value.split(/\n/).map(s=>s.trim()).filter(Boolean);function show(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.step').forEach(s=>s.classList.toggle('active',s.dataset.step===id));scrollTo({top:0,behavior:'smooth'})}function renderList(preserve=true){const next=parse(),old=new Map(words.map((w,i)=>[w+'\0'+i,enabled[i]!==false]));words=next;enabled=words.map((w,i)=>preserve?(old.get(w+'\0'+i)??true):true);$('checklist').innerHTML='';words.forEach((w,i)=>{const label=document.createElement('label');label.className='word-item';label.innerHTML=`<input type="checkbox" ${enabled[i]?'checked':''}><span></span>`;label.querySelector('span').textContent=w;label.querySelector('input').onchange=e=>{enabled[i]=e.target.checked;updateCount();save()};$('checklist').append(label)});updateCount()}function updateCount(){const n=enabled.filter(Boolean).length;$('count').textContent=`${n} selected`;$('start').disabled=n===0}$('words').oninput=()=>renderList(true);function renderChecks(){$('checklist').querySelectorAll('input').forEach((c,i)=>c.checked=enabled[i]);updateCount();save()}$('allOn').onclick=()=>{enabled=enabled.map(()=>true);renderChecks()};$('allOff').onclick=()=>{enabled=enabled.map(()=>false);renderChecks()};
const profiles={
'us-female':{lang:'en-US',names:['Samantha','Ava','Allison','Susan','Zira','Google US English']},
'us-male':{lang:'en-US',names:['Aaron','Alex','Fred','Tom','Microsoft David','Microsoft Mark']},
'uk-female':{lang:'en-GB',names:['Serena','Kate','Martha','Stephanie','Microsoft Hazel','Google UK English Female']},
'uk-male':{lang:'en-GB',names:['Daniel','Oliver','Arthur','Malcolm','Microsoft George','Google UK English Male']}
};
function voices(){return speechSynthesis.getVoices()}function resolveVoice(){const p=profiles[$('voice').value],all=voices(),exact=p.names.map(n=>all.find(v=>v.name.toLowerCase()===n.toLowerCase())).find(Boolean);if(exact)return exact;const named=p.names.map(n=>all.find(v=>v.name.toLowerCase().includes(n.toLowerCase()))).find(Boolean);if(named)return named;return all.find(v=>v.lang.toLowerCase()===p.lang.toLowerCase())||all.find(v=>v.lang.toLowerCase().startsWith(p.lang.slice(0,2).toLowerCase()))||null}function updateVoiceNote(){const p=profiles[$('voice').value],v=resolveVoice();$('voiceNote').textContent=v?`Using ${v.name} (${v.lang}).`:`Using the device default ${p.lang} voice.`}speechSynthesis.onvoiceschanged=updateVoiceNote;setTimeout(updateVoiceNote,100);
function say(text,once=false){speechSynthesis.cancel();const p=profiles[$('voice').value],selected=resolveVoice();let n=0,total=once?1:+$('repeat').value;const run=()=>{const u=new SpeechSynthesisUtterance(text);u.lang=p.lang;if(selected)u.voice=selected;u.rate=+$('rate').value;u.pitch=1;u.onend=()=>{n++;if(n<total)setTimeout(run,+$('pause').value)};speechSynthesis.speak(u)};run()}$('testVoice').onclick=()=>say('This is the selected English spelling voice.',true);
function renderProgress(){$('progressText').textContent=`${at+1} of ${session.length}`;$('number').textContent=`Word ${at+1}`;$('bar').style.width=`${((at+1)/session.length)*100}%`;$('prev').disabled=at===0;$('next').textContent=at===session.length-1?'Finish ✓':'Next →';$('session').textContent=shuffled?'Shuffled order':'Original order'}function begin(){session=words.filter((_,i)=>enabled[i]);at=0;shuffled=false;save();show('dictation');renderProgress();setTimeout(()=>say(session[0]),250)}$('start').onclick=begin;$('speak').onclick=()=>say(session[at]);$('prev').onclick=()=>{if(at>0){at--;renderProgress();say(session[at])}};$('next').onclick=()=>{if(at<session.length-1){at++;renderProgress();say(session[at])}else{speechSynthesis.cancel();show('setup');toast('Finished the spelling list.')}};$('back').onclick=()=>{speechSynthesis.cancel();show('setup')};$('restart').onclick=()=>{at=0;renderProgress();say(session[0]);toast('Back to word 1.')};$('shuffle').onclick=()=>{if(session.length<2)return toast('Enable at least two words.');for(let i=session.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[session[i],session[j]]=[session[j],session[i]]}at=0;shuffled=true;renderProgress();say(session[0]);toast('List shuffled.')};function load(s){$('profile').value=s.profile||'';$('lesson').value=s.lesson||'';$('words').value=s.words||'';$('voice').value=profiles[s.voice]?s.voice:'us-female';$('rate').value=s.rate||'0.92';$('repeat').value=s.repeat||'1';$('pause').value=s.pause||'800';words=parse();enabled=Array.isArray(s.enabled)&&s.enabled.length===words.length?s.enabled:words.map(()=>true);renderList(false);if(Array.isArray(s.enabled)&&s.enabled.length===words.length){enabled=s.enabled;renderChecks()}updateVoiceNote()}$('loadLast').onclick=()=>{load(store());toast('Last list loaded.')};['profile','lesson','voice','rate','repeat','pause'].forEach(id=>$(id).addEventListener('change',()=>{save();updateVoiceNote()}));load(store())})();
</script>
</body>
</html>
